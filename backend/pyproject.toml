[project]
name = "airguard"
version = "0.1.0"
description = "Plan Delhi commutes that breathe less PM2.5: route and departure-time advice from a validated forecast, explained by a tool-using agent."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost-cpu>=2.1",
  "strands-agents[ollama]>=1.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP017", "B905"]
